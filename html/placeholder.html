<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Construction</title>
  <style>
    .button {
      background-color: #007BFF;
      color: white;
      padding: 10px 20px;
      margin: 10px 0;
      border: none;
      border-radius: 5px;
      text-decoration: none;
      font-size: 16px;
      cursor: pointer;
      display: inline-block;
      text-align: center;
	  width: 105px;
    }
    .button:hover {
      background-color: #0056b3;
    }
	
	body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    hr {
      width: 60%;
      max-width: 400px;
      margin: 1rem auto;
      border: none;
      border-top: 2px solid #333;
    }

    a {
      margin-top: 2rem;
      text-decoration: none;
      color: #fff;
      background-color: #333;
      padding: 0.5rem 1.5rem;
      border-radius: 6px;
      transition: background-color 0.2s;
    }

    a:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <h1>🚧 Under Construction 🚧</h1>
  <hr>
  <a href="labs.html" class="button">Back to Labs</a>
</body>
</html>
